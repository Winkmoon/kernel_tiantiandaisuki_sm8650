name: 欧加真mt6897内核编译喵

env:
  TZ: Asia/Shanghai
  CPU: 'sn6850'
  FEIL: 'oplus'
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  KERNEL_NAME: 'ShirokoNeko_kernel'
  KERNELSU_VARIANT: 'SukiSU-Ultra'
  KERNELSU_BRANCH: 'susfs-dev'

on:
  workflow_dispatch:
    inputs:
      lz4k_enable:
        description: '是否安装 LZ4K 补丁喵'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      scx_enable:
        description: '是否安装风驰内核驱动喵'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      - name: 开始最大化建筑空间喵
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装配置环境所需依赖组件喵
        run: |
          sudo apt update
          sudo apt install -y llvm clang cmake \
            curl bison flex make binutils dwarves \
            git lld pahole zip perl gcc \
            python3 python-is-python3 bc \
            libssl-dev libelf-dev
          sudo wget https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          sudo ./llvm.sh 20 all
      - name: 初始化私有源码仓库喵
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace && cd kernel_workspace
          echo "正在克隆私有源码仓库喵..."
          git clone --depth=1 https://github.com/Winkmoon/kernel_tiantiandaisuki_sm8650 common -b fifteen
          echo "正在去除 ABI 保护 & 去除 dirty 后缀喵..."
          rm -f common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
      - name: 开始添加 SukiSU-Ultra喵
        id: ksu_version
        run: |
          cd kernel_workspace
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev
          cd KernelSU
          KSU_VERSION=$(expr $(git rev-list --count main) + 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$KSU_VERSION/" kernel/Makefile
      - name: 应用 Hide Stuff 修补程序喵
        run: |
          cd kernel_workspace/common
          wget -q https://github.com/SukiSU-Ultra/SukiSU_patch/raw/main/69_hide_stuff.patch
          patch -p1 < 69_hide_stuff.patch || true
      - name: 应用 lz4k 补丁喵
        if: ${{ github.event.inputs.lz4k_enable == 'true' }}
        run: |
          cd kernel_workspace/common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch .
          patch -p1 -F 3 < lz4kd.patch || true
      - name: 添加 SUSFS 配置设置喵
        run: |
          cd kernel_workspace/common
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          sed -i 's/check_defconfig//' build.config.gki
      - name: 添加内核附加名称喵
        run: |
          cd kernel_workspace/common/scripts
          suffix="${{ github.event.inputs.kernel_suffix || env.KERNEL_NAME }}"
          sed -i "\$s|echo \"\\\$res\"|echo \"-$suffix\"|" setlocalversion
      - name: 开始构建kernel啦喵
        run: |
          cd kernel_workspace/common
          make -j$(nproc) LLVM=-20 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld O=out \
            KCFLAGS+=-Wno-error gki_defconfig all
      - name: 克隆 AnyKernel3 并打包喵
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          cp common/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip_name="AnyKernel3_SukiSU_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_A14"
          [[ -n "${{ github.event.inputs.kernel_suffix }}" ]] && \
            zip_name+="_${{ github.event.inputs.kernel_suffix }}" || \
            zip_name+="_${{ env.KERNEL_NAME }}"
          zip -r9 ../${zip_name}.zip ./*
      - name: 上传 ZIP 工件喵
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_${{ github.run_number }}
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件喵
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_${{ github.run_number }}
          path: ./release_zips

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_HEAD }}-${{ github.run_number }}
          name: ${{ env.FULL_VERSION }} Build #${{ github.run_number }}
          body: |
            编译时间：${{ env.TIME_FORM }}
            ========================
            - 内核版本：${{ env.KERNEL_VERSION }}
            - Android 版本：${{ env.ANDROID_VERSION }}
            - 处理器平台：${{ env.CPU }}
          files: ./release_zips/*.zip
          
      - name: 创建发布喵
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.TAG_HEAD }}-${{ env.TIME }}"
          name: "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}"
          body: |
            - 内核版本号: ${{ env.FULL_VERSION }}
            - 编译时间: ${{ env.TIME_FORM }}
            - 机型：欧加8gen3 6.1 Android 14内核通用（基于oppopad Android 14 版官方OKI源码）
            - 特性：SukiSU Ultra + SUSFS + VFS + KPM
            - LZ4K支持：${{ github.event.inputs.lz4k_enable }}
            - 风驰内核支持：${{ github.event.inputs.scx_enable }}
            - 推荐系统：ColorOS 14 / RealmeUI 5.0
            - SukiSU管理器下载：[SukiSU-Ultra](https://github.com/ShirkNeko/SukiSU-Ultra/releases)
            ### ⏫️ 更新内容：
            - 更新SukiSU Ultra至最新版本（${{ needs.build.outputs.ksuver }}）
            - (预留)
            ### 📋 安装方法 | Installation Guide
            1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备
            2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启
            3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启
            ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          draft: false
          prerelease: false
          files: |
            release_zips/AnyKernel3_*.zipe
